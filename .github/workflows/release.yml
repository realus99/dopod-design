name: Release

# Pushing a v* tag publishes to npm and creates the GitHub release. Doing it by
# hand let the tag, the package.json version, and the release page drift apart,
# and required an interactive npm session.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every step but do not publish or create a release'
        type: boolean
        default: true

permissions:
  contents: write     # create the GitHub release
  id-token: write     # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tag annotations are the release notes

      # actions/checkout does not reliably materialise the annotated tag
      # *object* even at fetch-depth 0 — the ref can land as a lightweight tag.
      # When that happens `%(contents)` falls back to the commit message, and
      # v1.0.0 shipped release notes that were actually its commit message,
      # trailers and all (#30). Re-fetching forces the real objects.
      - name: Fetch tag objects
        run: git fetch --force --tags --prune

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      # The guard that matters. A tag that disagrees with package.json would
      # publish a version nobody asked for, and npm version numbers cannot be
      # reused even after unpublishing.
      # Everything below reads GITHUB_REF, which GitHub sets and validates —
      # never a free-text input.
      - name: Tag must match package.json
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          case "$GITHUB_REF" in
            refs/tags/*)
              TAG="${GITHUB_REF#refs/tags/}"
              echo "tag=$TAG"    >> "$GITHUB_OUTPUT"
              echo "is_tag=true" >> "$GITHUB_OUTPUT"
              echo "tag $TAG -> ${TAG#v} | package.json -> $PKG_VERSION"
              if [ "${TAG#v}" != "$PKG_VERSION" ]; then
                echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
                exit 1
              fi

              # Checked here rather than at the release step on purpose: that
              # runs *after* npm publish, so failing there would leave a
              # published version with no release page and no way to retry —
              # npm versions cannot be reused. Fail before anything ships.
              OBJ=$(git cat-file -t "$TAG" 2>/dev/null || echo missing)
              if [ "$OBJ" != "tag" ]; then
                echo "::error::$TAG is a $OBJ, not an annotated tag. The release"
                echo "::error::notes come from the tag annotation; a lightweight"
                echo "::error::tag silently publishes the commit message instead."
                echo "::error::Re-cut it with: git tag -a $TAG -F - <<'EOF' ... EOF"
                exit 1
              fi
              echo "$TAG is annotated; its message will be the release notes"
              ;;
            *)
              # Dispatched from a branch: rehearse the checks, never publish.
              echo "tag="         >> "$GITHUB_OUTPUT"
              echo "is_tag=false" >> "$GITHUB_OUTPUT"
              echo "not a tag ($GITHUB_REF) — checks only, publishing is skipped"
              ;;
          esac

      - name: Refuse to republish an existing version
        if: steps.version.outputs.is_tag == 'true'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published — npm versions cannot be reused"
            exit 1
          fi
          echo "$NAME@$VERSION is unpublished; proceeding"

      # Same gates as CI, re-run here so a tag can never ship something the
      # branch checks did not cover.
      - name: Build, test, assert contents
        run: npm run ci

      - name: Publish to npm
        if: steps.version.outputs.is_tag == 'true' && github.event.inputs.dry_run != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (dry run)
        if: steps.version.outputs.is_tag != 'true' || github.event.inputs.dry_run == 'true'
        run: |
          npm pack --dry-run
          echo "dry run — nothing published"

      - name: Create the GitHub release
        if: steps.version.outputs.is_tag == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The annotated tag message is the release notes — written when the
          # release was cut, by whoever cut it. The version step has already
          # asserted this tag is annotated, so %(contents) cannot fall through
          # to the commit message here.
          git tag -l --format='%(contents)' "$TAG" > notes.md

          # Commit trailers are for the git log, not the release page. These
          # reached v1.0.0's notes via the fallback bug; strip them so they
          # cannot again, whatever the annotation happens to contain.
          # No `sed -i` — BSD sed reads the next argument as a backup suffix,
          # so `-i -E` silently means something else and the strip no-ops. A
          # temp file behaves identically everywhere, including when someone
          # runs these lines by hand on macOS to check them.
          sed -E '/^(Co-Authored-By|Claude-Session|Signed-off-by):/d' notes.md > notes.clean
          # …and drop any blank lines that stripping left at the end.
          printf '%s\n' "$(cat notes.clean)" > notes.md
          rm -f notes.clean

          if [ ! -s notes.md ]; then
            echo "::error::$TAG has an annotation but it is empty after cleanup"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            echo "updated existing release $TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
            echo "created release $TAG"
          fi

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          {
            echo "### Release $TAG"
            echo
            if [ "$DRY" = "true" ]; then
              echo "**Dry run** — all checks ran, nothing was published."
            else
              echo "Published \`dopod-design@$VERSION\` with provenance."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
