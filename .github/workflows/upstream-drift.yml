name: Upstream drift

# Carbon ships minors weekly. Every token list, component inventory, and version
# number in references/ was verified by hand on one day; nothing else notices
# when a claim stops being true. Stale design-system guidance is worse than
# none, because it is confidently wrong.

on:
  schedule:
    - cron: '0 6 * * 1'     # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write             # to open or update the single tracking issue

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check claims against upstream
        id: check
        run: |
          set +e
          node scripts/check-upstream.js > report.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open or update the tracking issue
        if: steps.check.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Upstream Carbon drift detected"

          # One rolling issue, not a new one every Monday. Body is written to a
          # file rather than interpolated, so report content can never be
          # treated as shell or as a gh flag.
          {
            echo "\`scripts/check-upstream.js\` found claims in \`references/\` that no longer hold upstream."
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Last checked: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "To accept a legitimate upstream change, update the affected file in"
            echo "\`references/\` and re-run \`npm run check:upstream\` until it is green."
          } > body.md

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title \
                       --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
            echo "updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file body.md \
              --label "P0,area:content-freshness"
            echo "opened a new tracking issue"
          fi

      - name: Fail the run so the schedule shows red
        if: steps.check.outputs.exit != '0'
        run: exit 1
